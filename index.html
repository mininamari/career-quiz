<style>

     light/dark toggle: purple leads (~70%), white supports (~20%),
     indigo is the only text color on light surfaces. */
  :root {
    --purple: #4221B8;
    --purple-deep: #34199A;
    --white: #FFFFFF;
    --indigo: #210A74;
    --indigo-soft: #5B4E96;
    --light-purple: #9694FF;
    --light-purple-tint: #EDECFF;
    --coral: #FF5A56;
    --yellow: #FFE60A;
    --shadow: rgba(33, 10, 116, 0.28);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: radial-gradient(120% 100% at 50% 0%, var(--purple) 0%, var(--purple-deep) 100%);
    color: var(--indigo);
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
  }

  .display {

  }

  .doodles {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
  }
  .doodles svg {
    position: absolute;
    stroke: var(--white);
    opacity: 0.5;
    fill: none;
    stroke-width: 2.2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .doodle-star { top: 96px; left: 5%; width: 34px; }
  .doodle-bubble { top: 18%; right: 4%; width: 40px; }
  .doodle-globe { bottom: 14%; left: 3%; width: 38px; }
  .doodle-bulb { bottom: 6%; right: 6%; width: 32px; }
  @media (max-width: 560px) {
    .doodle-bubble, .doodle-globe { display: none; }
  }

  .app {
    position: relative;
    z-index: 1;
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  .topbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    row-gap: 10px;
    padding: 16px 18px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 7px;
    color: var(--white);
    font-weight: 900;
    font-size: 1.15rem;
    letter-spacing: -0.01em;
  }
  .brand-icon { font-size: 1.1rem; }
  .topbar-right {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: flex-end;
    gap: 8px;
    row-gap: 8px;
  }
  @media (max-width: 360px) {
    .topbar { padding: 12px 14px; gap: 8px; }
    .pill-cta { font-size: 0.72rem; padding: 8px 12px; }
    .lang-switch { font-size: 0.75rem; padding: 6px 22px 6px 10px; }
  }

  .flag-chip {
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--white);
    border-radius: 10px;
    padding: 5px 7px;
    box-shadow: 0 4px 10px var(--shadow);
  }
  .flag-chip svg { display: block; width: 22px; height: 15px; border-radius: 2px; }

  .lang-switch {
    appearance: none;
    background: var(--white);
    color: var(--indigo);
    border: none;
    border-radius: 999px;
    padding: 7px 26px 7px 12px;
    font-size: 0.8rem;
    font-weight: 700;
    background-image: linear-gradient(45deg, transparent 50%, var(--indigo-soft) 50%), linear-gradient(135deg, var(--indigo-soft) 50%, transparent 50%);
    background-position: right 12px center, right 7px center;
    background-size: 5px 5px, 5px 5px;
    background-repeat: no-repeat;
    cursor: pointer;
  }
  .pill-cta {
    background: var(--yellow);
    color: var(--indigo);
    font-weight: 800;
    font-size: 0.78rem;
    padding: 9px 14px;
    border-radius: 999px;
    text-decoration: none;
    white-space: nowrap;
    box-shadow: 0 4px 12px var(--shadow);
    transition: transform 0.15s ease;
  }
  .pill-cta:hover { transform: translateY(-1px); }

  .stage {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 6px 18px 40px;
    gap: 16px;
  }

  .card {
    background: var(--white);
    border-radius: 28px;
    padding: 28px 24px;
    box-shadow: 0 16px 40px var(--shadow);
  }

  .kicker {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-weight: 800;
    font-size: 0.72rem;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--indigo);
    background: var(--light-purple-tint);
    padding: 6px 12px;
    border-radius: 999px;
  }

  h1 {
    font-size: 1.7rem;
    font-weight: 900;
    line-height: 1.15;
    margin: 14px 0 10px;
    text-wrap: balance;
    color: var(--indigo);
  }
  .intro-highlight {
    font-size: 0.98rem;
    line-height: 1.55;
    margin: 0 0 20px;
    font-weight: 600;
    color: var(--indigo);
  }

  .start-btn {
    display: block;
    width: 100%;
    text-align: center;
    background: var(--yellow);
    color: var(--indigo);
    font-size: 1.05rem;
    font-weight: 900;
    border: none;
    border-radius: 18px;
    padding: 16px;
    cursor: pointer;
    box-shadow: 0 10px 24px var(--shadow);
    transition: transform 0.15s ease;
  }
  .start-btn:hover { transform: translateY(-2px); }

  .skip-link {
    display: block;
    text-align: center;
    margin-top: 14px;
    font-size: 0.85rem;
    color: var(--purple);
    text-decoration: none;
    font-weight: 700;
  }

  .progress-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
    gap: 12px;
  }
  .progress-count {
    font-variant-numeric: tabular-nums;
    font-size: 0.78rem;
    font-weight: 700;
    color: var(--indigo-soft);
    white-space: nowrap;
  }
  .progress-track {
    flex: 1;
    height: 8px;
    background: var(--light-purple-tint);
    border-radius: 999px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--purple);
    border-radius: 999px;
    transition: width 0.35s ease;
  }

  .q-dots {
    display: flex;
    gap: 5px;
    margin-bottom: 18px;
  }
  .q-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--light-purple-tint);
  }
  .q-dot.answered { background: var(--light-purple); }
  .q-dot.current { background: var(--purple); }

  .q-text {
    font-size: 1.25rem;
    font-weight: 800;
    line-height: 1.3;
    margin: 0 0 18px;
    text-wrap: balance;
    color: var(--indigo);
  }

  .options {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .option {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    text-align: left;
    background: var(--light-purple-tint);
    border: 2px solid transparent;
    border-radius: 16px;
    padding: 13px 14px;
    font-size: 0.95rem;
    color: var(--indigo);
    cursor: pointer;
    transition: border-color 0.15s ease, transform 0.1s ease, background 0.15s ease, color 0.15s ease;
  }
  .option:hover { transform: translateY(-1px); border-color: var(--light-purple); }
  .option.selected {
    background: var(--purple);
    color: var(--white);
  }
  .option-badge {
    flex-shrink: 0;
    width: 30px;
    height: 30px;
    border-radius: 10px;
    background: var(--white);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.05rem;
  }
  .option-text { flex: 1; line-height: 1.4; }

  .back-row {
    margin-top: 16px;
    display: flex;
    justify-content: flex-start;
  }
  .ghost-btn {
    background: none;
    border: none;
    color: var(--indigo-soft);
    font-size: 0.85rem;
    font-weight: 700;
    cursor: pointer;
    padding: 6px 4px;
  }
  .ghost-btn:hover { color: var(--purple); }

  .result-badge {
    width: 64px;
    height: 64px;
    border-radius: 20px;
    background: var(--light-purple-tint);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2rem;
    margin-bottom: 14px;
  }
  .result-kicker {
    font-size: 0.72rem;
    font-weight: 800;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--indigo-soft);
    margin-bottom: 4px;
  }
  .result-title {
    font-size: 1.7rem;
    font-weight: 900;
    margin: 0 0 10px;
    text-wrap: balance;
    color: var(--indigo);
  }
  .result-copy {
    font-size: 0.95rem;
    line-height: 1.55;
    color: var(--indigo-soft);
    margin: 0 0 16px;
  }
  .result-lead {
    font-size: 0.95rem;
    font-weight: 800;
    color: var(--indigo);
    margin: 0 0 10px;
  }
  .career-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 18px;
  }
  .career-chip {
    background: var(--light-purple-tint);
    color: var(--indigo);
    border-radius: 12px;
    padding: 10px 12px;
    font-size: 0.85rem;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .result-pitch {
    font-size: 0.92rem;
    line-height: 1.6;
    color: var(--indigo);
    background: var(--light-purple-tint);
    border-radius: 16px;
    padding: 14px 16px;
    margin-bottom: 20px;
  }

  .hero-cta {
    display: block;
    text-align: center;
    text-decoration: none;
    background: var(--yellow);
    color: var(--indigo);
    font-weight: 900;
    font-size: 1.05rem;
    padding: 18px;
    border-radius: 18px;

  .hero-cta-sub {
    display: block;
    font-size: 0.78rem;
    font-weight: 700;
    opacity: 0.75;
    margin-top: 3px;

  .retake-link {
    display: block;
    text-align: center;
    margin-top: 14px;
    font-size: 0.85rem;
    color: var(--indigo-soft);
    text-decoration: underline;
    background: none;
    border: none;
    cursor: pointer;
    width: 100%;
  }

</style>

  var SUPPORTED = Object.keys(LANG);

  function detectLang() {
    var candidates = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language || "en"];
    for (var i = 0; i < candidates.length; i++) {
      var code = String(candidates[i]).toLowerCase().split("-")[0];
      if (SUPPORTED.indexOf(code) !== -1) return code;
    }
    return "en";
  }

  var state = {
    lang: detectLang(),
    qIndex: 0,
    answers: [] // answers[i] = letter
  };

  // ---- Language switcher ----
  var langSwitch = document.getElementById("langSwitch");
  SUPPORTED.forEach(function (code) {
    var opt = document.createElement("option");
    opt.value = code;
    opt.textContent = LANG[code].name;
    langSwitch.appendChild(opt);
  });
  langSwitch.value = state.lang;
  langSwitch.addEventListener("change", function () {
    state.lang = langSwitch.value;
    render();
  });

  var headerCta = document.getElementById("headerCta");

  function t() { return LANG[state.lang]; }

  function renderChrome() {
    var d = t();
    document.documentElement.lang = state.lang;
    document.getElementById("brandName").textContent = d.brand;
    headerCta.textContent = "✨ " + d.header.cta;
    headerCta.href = linkFor(state.lang);
  }

  function renderIntro() {
    var d = t().intro;
    document.getElementById("introKicker").textContent = d.kicker;
    document.getElementById("introTitle").textContent = d.title;
    document.getElementById("introCopy2").textContent = d.copy2;
    document.getElementById("startBtn").textContent = d.start;
    var skip = document.getElementById("skipLink");
    skip.textContent = d.skip;
    skip.href = linkFor(state.lang);
  }

  function currentCounts() {
    var counts = { A: 0, B: 0, C: 0, D: 0, E: 0, F: 0 };
    state.answers.forEach(function (letter) {
      if (letter) counts[letter]++;
    });
    return counts;
  }

  function renderQuestion() {
    var d = t();
    var q = d.questions[state.qIndex];
    var total = d.questions.length;

    document.getElementById("progressCount").textContent =
      d.quiz.questionLabel + " " + (state.qIndex + 1) + " " + d.quiz.of + " " + total;
    document.getElementById("progressFill").style.width =
      (((state.qIndex) / total) * 100) + "%";

    var dotsWrap = document.getElementById("qDots");
    dotsWrap.innerHTML = "";
    for (var i = 0; i < total; i++) {
      var dot = document.createElement("span");
      var cls = "q-dot";
      if (i === state.qIndex) cls += " current";
      else if (state.answers[i]) cls += " answered";
      dot.className = cls;
      dotsWrap.appendChild(dot);
    }

    document.getElementById("qText").textContent = q.text;

    var optionsWrap = document.getElementById("qOptions");
    optionsWrap.innerHTML = "";

    var selected = state.answers[state.qIndex];

    q.options.forEach(function (opt) {
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "option" + (selected === opt.l ? " selected" : "");
      btn.innerHTML =
        '<span class="option-badge">' + opt.e + '</span>' +
        '<span class="option-text">' + opt.t + '</span>';
      btn.addEventListener("click", function () {
        state.answers[state.qIndex] = opt.l;
        if (state.qIndex < total - 1) {
          state.qIndex++;
          renderQuestion();
        } else {
          showResult();
        }
      });
      optionsWrap.appendChild(btn);
    });

    var backBtn = document.getElementById("backBtn");
    backBtn.textContent = d.quiz.back;
    backBtn.style.visibility = state.qIndex === 0 ? "hidden" : "visible";
  }

  function showScreen(name) {
    ["screenIntro", "screenQuiz", "screenResult"].forEach(function (id) {
      document.getElementById(id).hidden = id !== name;
    });
  }

  function showResult() {
    var d = t();
    var counts = currentCounts();
    var winner = LETTERS[0];
    var best = -1;
    LETTERS.forEach(function (l) {
      if (counts[l] > best) { best = counts[l]; winner = l; }
    });
    var r = d.results[winner];

    document.getElementById("resultBadge").textContent = r.emoji;
    document.getElementById("resultKicker").textContent = d.result.kicker;
    document.getElementById("resultTitle").textContent = r.title;
    document.getElementById("resultCopy").textContent = r.copy;
    document.getElementById("resultLead").textContent = d.result.careersLead;

    var grid = document.getElementById("careerGrid");
    grid.innerHTML = "";
    r.careers.forEach(function (c) {
      var chip = document.createElement("div");
      chip.className = "career-chip";
      chip.textContent = c;
      grid.appendChild(chip);
    });

    document.getElementById("resultPitch").textContent = r.pitch + " " + d.result.pitchIntro;

    var cta = document.getElementById("resultCta");
    cta.href = linkFor(state.lang);
    document.getElementById("resultCtaMain").textContent = "🚀 " + d.result.ctaMain;
    document.getElementById("resultCtaSub").textContent = d.result.ctaSub;

    document.getElementById("retakeBtn").textContent = d.result.retake;

    showScreen("screenResult");
    window.scrollTo(0, 0);
  }

  document.getElementById("startBtn").addEventListener("click", function () {
    state.qIndex = 0;
    showScreen("screenQuiz");
    renderQuestion();
  });

  document.getElementById("backBtn").addEventListener("click", function () {
    if (state.qIndex > 0) {
      state.qIndex--;
      renderQuestion();
    }
  });

  document.getElementById("retakeBtn").addEventListener("click", function () {
    state.qIndex = 0;
    state.answers = [];
    showScreen("screenIntro");
    window.scrollTo(0, 0);
  });

  function render() {
    renderChrome();
    renderIntro();
    if (!document.getElementById("screenQuiz").hidden) renderQuestion();
    if (!document.getElementById("screenResult").hidden) showResult();
  }

  render();
  showScreen("screenIntro");
})();
